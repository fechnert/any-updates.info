<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>Any updates?</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #e0e0e0;
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      font-size: 9rem;
      margin: 0;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.3rem;
      color: #b0c4de;
      margin-top: 1.2rem;
      max-width: 600px;
    }
    @media (max-width: 768px) {
      body {
        padding: 1.5rem;
      }
      h1 {
        font-size: 4rem;
      }
      p {
        font-size: 1rem;
      }
    }
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      h1 {
        font-size: 2.5rem;
      }
      p {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <h1>No.</h1>
  <p>If someone sent you this, it probably means there are no updates to share at this time.</p>
  <p>Please remain patient,<br>you will be kept informed of any updates as they become available.</p>
</body>
</html>
